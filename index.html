<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Marketplace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<section class="login hidden" id="login">
  <div class="login-card">
    <div class="marca grande">📡 Radar Marketplace</div>
    <p class="muted small">Validação de produto no Mercado Livre, na Shopee, na Amazon e no Google.</p>
    <input id="senha" type="password" placeholder="Senha do time" autocomplete="current-password">
    <button class="pri" id="entrar" type="button">Entrar</button>
  </div>
</section>

<div class="app hidden" id="app">
  <aside class="lado">
    <div class="marca">📡 Radar<span>Marketplace</span></div>
    <nav id="nav">
      <button data-aba="trilha"><span>🧭</span>Trilha</button>
      <button data-aba="painel" class="ativo"><span>📊</span>Painel</button>
      <button data-aba="pesquisar"><span>🔎</span>Pesquisar</button>
      <button data-aba="catalogo"><span>📦</span>Catálogo</button>
      <button data-aba="lote"><span>📋</span>Lote</button>
      <button data-aba="vigiadas"><span>🔔</span>Vigiadas</button>
      <button data-aba="loja"><span>🛒</span>Minha loja</button>
      <button data-aba="calendario"><span>📅</span>Calendário</button>
      <button data-aba="taxas"><span>⚙️</span>Taxas</button>
    </nav>
    <div class="lado-rodape">
      <div class="canais-logos" id="logos-lado"></div>
      <button class="link" id="tema" type="button">🌓 Tema</button>
      <button class="link" id="sair" type="button">🔒 Sair</button>
    </div>
  </aside>

  <main class="conteudo">
    <header class="topo">
      <form class="busca" id="f">
        <input id="q" placeholder="Palavra-chave do produto (ex.: fita de borda adesiva)" autocomplete="off" maxlength="120">
        <button class="pri" id="btn" type="submit">Pesquisar</button>
      </form>
    </header>
    <div id="msg"></div>

    <section class="aba" id="aba-painel"></section>
    <section class="aba hidden" id="aba-trilha"></section>
    <section class="aba hidden" id="aba-pesquisar">
      <div id="resultado"><div class="estado"><h1>Esse produto vende? E dá lucro?</h1><p class="muted">Digite a palavra-chave lá em cima.</p></div></div>
    </section>
    <section class="aba hidden" id="aba-lote"></section>
    <section class="aba hidden" id="aba-vigiadas"></section>
    <section class="aba hidden" id="aba-taxas"></section>
    <section class="aba hidden" id="aba-catalogo"></section>
    <section class="aba hidden" id="aba-loja"></section>
    <section class="aba hidden" id="aba-calendario"></section>
  </main>
</div>

<div class="dica-flutuante" id="tip" role="tooltip"></div>
<script src="/lib/margem.js"></script>
<script src="/lib/frete.js"></script>
<script src="/lib/precoideal.js"></script>
<script src="/lib/calendario.js"></script>
<script src="/lib/recomendacao.js"></script>
<script src="/lib/palavras.js"></script>
<script src="/app.js"></script>
</body>
</html>

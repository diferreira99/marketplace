<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121733">
<meta name="description" content="Validação de produto no Mercado Livre, na Shopee, na Amazon e no Google.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<title>Radar Marketplace</title>
<link rel="icon" type="image/svg+xml" href="/icones/icone.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icones/icone-192.png">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<section class="login hidden" id="login">
  <div class="login-card">
    <div class="marca grande">📡 Radar Marketplace</div>
    <p class="muted small">Validação de produto no Mercado Livre, na Shopee, na Amazon e no Google.</p>
    <input id="senha" type="password" placeholder="Senha do time" autocomplete="current-password">
    <button class="pri" id="entrar" type="button">Entrar</button>
  </div>
</section>

<div class="folha-fundo hidden" id="folha-fundo"></div>
<div class="folha hidden" id="folha" role="dialog" aria-label="Menu"></div>
<div class="app hidden" id="app">
  <div class="gaveta-fundo" id="gaveta-fundo"></div>
  <aside class="lado" id="lado">
    <div class="marca"><img src="/icones/icone-192.png" alt=""><div>Radar<span>Marketplace</span></div></div>
    <nav id="nav">
      <div class="nav-grupo">Principal</div>
      <button data-mob="1" data-aba="pesquisar"><span>🔎</span>Pesquisar</button>
      <button data-mob="1" data-aba="catalogo"><span>📦</span>Produtos</button>
      <button data-mob="1" data-aba="simulador"><span>💵</span>Simulador</button>
      <button data-mob="1" data-aba="painel"><span>📊</span>Histórico</button>
      <div class="nav-grupo">Mais ferramentas</div>
      <button data-aba="lote"><span>📋</span>Lote</button>
      <button data-aba="vigiadas"><span>🔔</span>Vigiadas</button>
      <button data-aba="loja"><span>🛒</span>Minha loja</button>
      <button data-aba="calendario"><span>📅</span>Calendário</button>
      <button data-aba="taxas"><span>⚙️</span>Taxas</button>
      <div class="nav-grupo">Ajuda</div>
      <button data-aba="trilha"><span>🧭</span>Guia</button>
      <button type="button" id="nav-mais" class="so-cel"><span>☰</span>Mais</button>
    </nav>
    <div class="lado-rodape">
      <button class="pri rod-instalar hidden" id="bt-instalar" type="button">📲 Instalar o app</button>
      <div class="rod-status" id="rod-status"><span class="rod-ponto"></span><span id="rod-status-t">Conectando…</span></div>
      <div class="rod-botoes">
        <button type="button" id="tema" title="Trocar tema"><span id="tema-ic">🌙</span><span id="tema-t">Escuro</span></button>
        <button type="button" id="sair" title="Sair"><span>🔒</span><span>Sair</span></button>
      </div>
    </div>
  </aside>

  <main class="conteudo">
    <header class="topo">
      <div class="barra-cel">
        <button type="button" id="abrir-menu" aria-label="Abrir menu" aria-controls="lado" aria-expanded="false"><span></span><span></span><span></span></button>
        <img src="/icones/icone-192.png" alt="">
        <div class="barra-cel-t"><b>Radar</b><span id="barra-aba">Painel</span></div>
      </div>
      <form class="busca" id="f">
        <input id="q" placeholder="Palavra-chave do produto (ex.: fita de borda adesiva)" autocomplete="off" maxlength="120">
        <button class="pri" id="btn" type="submit">Pesquisar</button>
      </form>
    </header>
    <div id="msg"></div>

    <section class="aba" id="aba-painel"></section>
    <section class="aba hidden" id="aba-trilha"></section>
    <section class="aba hidden" id="aba-simulador"></section>
    <section class="aba hidden" id="aba-pesquisar">
      <div id="resultado"><div class="estado"><h1>Esse produto vende? E dá lucro?</h1><p class="muted">Digite a palavra-chave lá em cima.</p></div></div>
    </section>
    <section class="aba hidden" id="aba-lote"></section>
    <section class="aba hidden" id="aba-vigiadas"></section>
    <section class="aba hidden" id="aba-taxas"></section>
    <section class="aba hidden" id="aba-catalogo"></section>
    <section class="aba hidden" id="aba-loja"></section>
    <section class="aba hidden" id="aba-calendario"></section>
  </main>
</div>

<div class="dica-flutuante" id="tip" role="tooltip"></div>
<script src="/lib/margem.js"></script>
<script src="/lib/frete.js"></script>
<script src="/lib/precoideal.js"></script>
<script src="/lib/calendario.js"></script>
<script src="/lib/recomendacao.js"></script>
<script src="/lib/palavras.js"></script>
<script src="/app.js"></script>
</body>
</html>
